[project]
name = "s1_hswind_predictor"
requires-python = ">= 3.9"
license-files = ["LICENCE.txt"]
description = "Estimate Hs wind Sea from official ESA L2 OCN product with deep learning model"
readme = "README.md"
dependencies = [
  "python-dateutil",
  "tensorflow",
  "dataclasses",
  "netcdf4",
  "numpy",
]
# to match ESA IPF restrictions, successful predictions have been tested with following versions
# micromamba install numpy==1.19.5 xarray==2022.03 pandas==1.4.4 scipy==1.6.0 tensorflow==2.7.0
keywords = [
  "xarray",
  "earth-observation",
  "remote-sensing",
  "satellite-imagery",
  "sentinel1",
  "sar",
  "synthetic-aperture-radar",
  "wave",
  "hs",
  "swh"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
]
dynamic = ["version"]

[project.urls]
repository = "https://github.com/s1tools/s1_hswind_predictor"

[tool.setuptools]
packages = ["hswind_inference"]
package-dir = {"" = "src"}
